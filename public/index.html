<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit — Cadastro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <main class="card">
      <header class="card-head">
        <span class="brand">
          <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="16" cy="16" r="7.5" stroke="#fff" stroke-width="2"/>
            <ellipse cx="16" cy="16" rx="14.5" ry="5.6" stroke="#fff" stroke-width="1.6"
                     transform="rotate(-22 16 16)"/>
          </svg>
          Orbit 2.0
        </span>
      </header>

      <div class="card-body">
        <div class="orb" aria-hidden="true"><span></span></div>

        <h1>entre com sua conta</h1>
        <p class="sub">Acesse o novo Orbit 2.0 com seu RA e sua senha.</p>

        <p id="erro" class="erro" hidden>Preencha RA e senha.</p>

        <form method="post" action="/cadastro" autocomplete="on">
          <div class="field">
            <label for="ra">RA</label>
            <input id="ra" name="ra" type="text" inputmode="numeric" required autofocus
                   autocomplete="username" placeholder="Digite seu RA">
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required
                   autocomplete="new-password" placeholder="Digite sua senha">
          </div>

          <button type="submit" class="btn">Entrar</button>
        </form>
      </div>
    </main>

    <footer class="foot">© 2026 ORBIT · Portal interno</footer>
  </div>

  <script>
    // Mostra a mensagem de erro quando redirecionado com ?erro=1
    if (new URLSearchParams(location.search).get('erro')) {
      document.getElementById('erro').hidden = false;
    }
  </script>
</body>
</html>
